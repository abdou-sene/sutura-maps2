<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#14202a;--sand:#f3f1ee;--terra:#123c46;--terra2:#1f5b68;--gold:#e2673f;--muted:#64727a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:var(--sand);font-family:"DM Sans",sans-serif;color:var(--ink);
       padding:66px 74px;display:flex;flex-direction:column;justify-content:space-between;
       position:relative;overflow:hidden;}
  .deco{position:absolute;top:-80px;right:-80px;width:360px;height:360px;
        border:1px solid #e0d9cf;transform:rotate(15deg);}
  .deco2{position:absolute;top:-40px;right:-40px;width:280px;height:280px;
         border:1px solid var(--terra2);opacity:.35;transform:rotate(15deg);}
  .brand{font-family:"Cormorant Garamond",serif;font-size:2rem;font-weight:600;
         letter-spacing:2px;}
  .brand em{font-style:italic;color:var(--terra);}
  .mid{max-width:900px;}
  .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;
           letter-spacing:5px;text-transform:uppercase;color:var(--terra);margin-bottom:16px;}
  h1{font-family:"Cormorant Garamond",serif;font-size:4.3rem;font-weight:700;line-height:1.04;}
  h1 em{font-style:italic;font-weight:400;color:var(--terra);}
  .sub{font-family:"Cormorant Garamond",serif;font-size:1.9rem;color:var(--muted);
       margin-top:18px;line-height:1.35;}
  .chips{display:flex;gap:14px;margin-top:2px;}
  .chip{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.15rem;
        letter-spacing:1.5px;text-transform:uppercase;padding:10px 20px;
        border:1.5px solid var(--ink);border-radius:3px;}
  .chip.on{background:var(--ink);color:var(--sand);border-color:var(--ink);}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;}
  .url{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.6rem;
       letter-spacing:2px;text-transform:uppercase;border-bottom:3px solid var(--terra);padding-bottom:4px;}
  .price{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.5rem;color:var(--muted);}
</style>
</head>
<body>
  <div class="deco"></div><div class="deco2"></div>

  <div class="brand">Sutura <em>Maps</em></div>

  <div class="mid">
    <div class="eyebrow">Sénégal · Afrique de l'Ouest</div>
    <h1>Les cartes de votre territoire,<br><em>en une minute.</em></h1>
    <div class="sub">Communes, départements, régions. À partir de données officielles, sans QGIS.</div>
  </div>

  <div class="chips">
    <span class="chip on">Localisation</span>
    <span class="chip">Occupation du sol</span>
    <span class="chip">Relief (MNT)</span>
  </div>

  <div class="foot">
    <span class="url">sutura-maps.com</span>
    <span class="price">2 000 FCFA par carte · Satisfait ou remboursé</span>
  </div>
</body>
</html>
