<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/style.css" />
<style>body{background:var(--sand,#f7f3ec);} .step{display:block!important;}</style>
</head>
<body>
<main>
  <section id="step-loading" class="step active">
    <div id="loading-screen">
      <div id="loading-anim">
        <span class="la-ring la-r1"></span>
        <span class="la-ring la-r2"></span>
        <span class="la-ring la-r3"></span>
        <span class="la-cross-h"></span>
        <span class="la-cross-v"></span>
        <span class="la-sweep"></span>
        <span class="la-pin"></span>
      </div>
      <div id="loading-title">Génération en cours</div>
      <div id="loading-commune">COMMUNE DE DANKH SENE</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-steps">
        <span class="lstep done" id="ls1">Chargement des données</span>
        <span class="lstep active" id="ls2">Calcul des voisins</span>
        <span class="lstep" id="ls3">Rendu cartographique</span>
      </div>
      <div id="loading-tip" class="show">
        Votre carte est générée gratuitement : vous ne payez que pour
        télécharger la version HD sans filigrane.
      </div>
    </div>
  </section>
</main>
</body>
</html>
