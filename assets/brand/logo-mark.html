<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;}
  .mark{position:relative;width:100vw;height:100vh;background:#14202a;
        display:flex;align-items:center;justify-content:center;overflow:hidden;}
  /* cadre intérieur discret */
  .ring{position:absolute;inset:11vw;border:0.8vw solid rgba(247,243,236,0.14);border-radius:6vw;}
  .s{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:62vw;
     color:#f3f1ee;line-height:1;position:relative;}
  /* point terracotta, signature de la marque */
  .dot{position:absolute;width:9vw;height:9vw;border-radius:50%;background:#e2673f;
       right:26vw;top:30vw;}
</style></head>
<body>
  <div class="mark">
    <div class="ring"></div>
    <span class="s">S</span>
    <span class="dot"></span>
  </div>
  <script>
    // ?noring=1 : sans cadre (favicons en petite taille)
    if (new URLSearchParams(location.search).has("noring")) {
      document.querySelector(".ring").style.display = "none";
    }
  </script>
</body></html>
