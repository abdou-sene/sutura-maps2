<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0e0c0a;--sand:#f7f3ec;--terra:#b85c2c;--muted:#7a7068;--green:#1c7a3a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:520px;}
  body{background:#ffffff;font-family:"DM Sans",sans-serif;color:var(--ink);
       padding:34px 44px;display:flex;flex-direction:column;}

  .title{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:700;
         text-align:center;margin-bottom:6px;}
  .title em{font-style:italic;color:var(--terra);}
  .sub{text-align:center;font-size:.98rem;color:var(--muted);margin-bottom:22px;}

  .row{display:flex;align-items:center;justify-content:center;gap:26px;flex:1;min-height:0;}
  .panel{position:relative;width:470px;border:1px solid #ddd6ca;
         box-shadow:0 10px 28px rgba(14,12,10,.12);background:#fff;overflow:hidden;}
  .panel img{display:block;width:100%;height:auto;}

  /* Filigrane sur la vignette de gauche */
  .wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .chip{position:absolute;top:12px;left:12px;z-index:3;
        font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.95rem;
        letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:2px;}
  .chip.no{background:rgba(184,92,44,.92);color:#fff;}
  .chip.yes{background:rgba(28,122,58,.95);color:#fff;}

  .arrow{font-family:"DM Sans";font-size:2.4rem;color:var(--terra);font-weight:700;flex:0 0 auto;}

  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .foot .brand{font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:600;letter-spacing:1px;}
  .foot .brand em{font-style:italic;color:var(--terra);}
  .foot .note{font-size:.9rem;color:var(--muted);}
</style>
</head>
<body>

  <div class="title">Avant / <em>après paiement</em></div>
  <div class="sub">Le filigrane que tu vois disparaît. Ta carte payée est propre, prête pour ton rapport.</div>

  <div class="row">
    <div class="panel">
      <span class="chip no">Aperçu · filigrané</span>
      <img src="file:///C:/Users/LBC/Documents/MES%20DOCS/SUCCESS/ENTREPRENDRE/SAAS/MaCommune_V2_N/assets/gallery/Foundiougn_dept.png" alt="" />
    </div>

    <div class="arrow">&rarr;</div>

    <div class="panel">
      <span class="chip yes">Payée · sans filigrane</span>
      <img src="file:///C:/Users/LBC/Documents/MES%20DOCS/SUCCESS/ENTREPRENDRE/SAAS/MaCommune_V2_N/assets/gallery/Foundiougn_dept_sans_filigrane.png" alt="" />
    </div>
  </div>

  <div class="foot">
    <span class="brand">Sutura <em>Maps</em></span>
    <span class="note">2 000 FCFA · téléchargement immédiat · satisfait ou remboursé</span>
  </div>

</body>
</html>
