<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sutura Maps — Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ink: #0e0c0a;
        --sand: #f7f3ec;
        --terra: #b85c2c;
        --gold: #c9a84c;
        --muted: #7a7068;
        --line: rgba(14, 12, 10, 0.1);
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--sand);
        color: var(--ink);
        min-height: 100vh;
      }

      #login-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-card {
        background: white;
        padding: 3rem;
        border-radius: 2px;
        border: 1px solid var(--line);
        text-align: center;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 8px 32px rgba(14, 12, 10, 0.08);
      }
      .login-card h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .login-card p {
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 2rem;
      }
      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 1px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        background: var(--sand);
      }
      .btn-primary {
        background: var(--terra);
        color: white;
        border: none;
        padding: 12px 24px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.78rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 1px;
        width: 100%;
      }
      .btn-primary:hover {
        background: var(--ink);
      }

      #admin-screen {
        display: none;
        padding: 2rem;
      }
      header {
        background: var(--ink);
        color: white;
        padding: 1.2rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: -2rem -2rem 2rem;
        border-radius: 0;
      }
      header h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 700;
      }
      header span {
        color: var(--terra);
        font-style: italic;
      }
      .logout {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.6);
        padding: 6px 16px;
        font-size: 0.72rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 1px;
      }
      .logout:hover {
        border-color: var(--terra);
        color: var(--terra);
      }

      /* STATS */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1px;
        background: var(--line);
        border: 1px solid var(--line);
        margin-bottom: 2rem;
      }
      .stat {
        background: white;
        padding: 1.5rem;
        text-align: center;
      }
      .stat-value {
        font-family: "Cormorant Garamond", serif;
        font-size: 3rem;
        font-weight: 700;
        color: var(--ink);
        line-height: 1;
      }
      .stat-label {
        font-size: 0.65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 0.4rem;
        font-weight: 500;
      }
      .stat.highlight .stat-value {
        color: var(--terra);
      }

      /* VERIFY */
      .verify-card {
        background: white;
        border: 1px solid var(--line);
        padding: 2rem;
        border-radius: 2px;
        margin-bottom: 2rem;
        position: relative;
        overflow: hidden;
      }
      .verify-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--terra), var(--gold));
      }
      .verify-card h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .code-input {
        display: flex;
        gap: 0.8rem;
        align-items: center;
      }
      .code-input input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid var(--line);
        border-radius: 1px;
        font-family: "Cormorant Garamond", serif;
        font-size: 1.4rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: 600;
        background: var(--sand);
      }
      .code-input input:focus {
        outline: none;
        border-color: var(--terra);
      }
      .code-input button {
        background: var(--terra);
        color: white;
        border: none;
        padding: 12px 24px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.78rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 1px;
        white-space: nowrap;
      }
      .code-input button:hover {
        background: var(--ink);
      }

      .verify-result {
        margin-top: 1.2rem;
        padding: 1rem 1.4rem;
        border-radius: 1px;
        display: none;
      }
      .verify-result.success {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .verify-result.error {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
      .verify-result.warning {
        background: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
      }
      .result-commune {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.3rem;
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .result-link {
        display: inline-block;
        margin-top: 0.8rem;
        background: var(--ink);
        color: white;
        padding: 8px 20px;
        font-size: 0.75rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 1px;
      }
      .copy-link {
        display: inline-block;
        margin-top: 0.5rem;
        margin-left: 0.5rem;
        background: var(--terra);
        color: white;
        padding: 8px 20px;
        font-size: 0.75rem;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        border: none;
        border-radius: 1px;
        cursor: pointer;
      }

      /* TABLES */
      .table-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 2px;
        margin-bottom: 2rem;
        overflow: hidden;
      }
      .table-header {
        padding: 1.2rem 1.5rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .table-header h3 {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.2rem;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 10px;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .badge-pending {
        background: #fff3cd;
        color: #856404;
      }
      .badge-paid {
        background: #d4edda;
        color: #155724;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        font-size: 0.62rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
        padding: 10px 15px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      td {
        padding: 12px 15px;
        font-size: 0.82rem;
        border-bottom: 1px solid rgba(14, 12, 10, 0.05);
      }
      tr:last-child td {
        border-bottom: none;
      }
      tr:hover td {
        background: var(--sand);
      }
      .code-cell {
        font-family: "Cormorant Garamond", serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--terra);
      }
      .empty {
        text-align: center;
        padding: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
        font-style: italic;
      }

      .refresh-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 6px 14px;
        font-size: 0.72rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 1px;
      }
      .refresh-btn:hover {
        border-color: var(--ink);
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login-screen">
      <div class="login-card">
        <h1>Sutura<span>·Maps</span></h1>
        <p>Espace administration</p>
        <input
          type="password"
          id="pwd-input"
          placeholder="Mot de passe admin"
          onkeydown="if (event.key === 'Enter') login();"
        />
        <button class="btn-primary" onclick="login()">Accéder →</button>
        <div
          id="login-error"
          style="
            margin-top: 1rem;
            font-size: 0.78rem;
            color: #c0392b;
            display: none;
          "
        >
          Mot de passe incorrect
        </div>
      </div>
    </div>

    <!-- ADMIN -->
    <div id="admin-screen">
      <header>
        <h1>Sutura<span>·Maps</span> — Admin</h1>
        <button class="logout" onclick="logout()">Déconnexion</button>
      </header>

      <!-- STATS -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat">
          <div class="stat-value" id="s-visits">—</div>
          <div class="stat-label">Visites</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="s-gen">—</div>
          <div class="stat-label">Cartes générées</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="s-init">—</div>
          <div class="stat-label">Paiements initiés</div>
        </div>
        <div class="stat highlight">
          <div class="stat-value" id="s-paid">—</div>
          <div class="stat-label">Payés</div>
        </div>
        <div class="stat highlight">
          <div class="stat-value" id="s-rev">—</div>
          <div class="stat-label">Revenus (FCFA)</div>
        </div>
      </div>

      <!-- VÉRIFIER UN CODE -->
      <div class="verify-card">
        <h2>Valider un paiement</h2>
        <div class="code-input">
          <input
            type="text"
            id="code-input"
            placeholder="SUT-XXXX-XXXX"
            maxlength="13"
            oninput="formatCode(this)"
            onkeydown="if (event.key === 'Enter') verifyCode();"
          />
          <button onclick="verifyCode()">Valider →</button>
        </div>
        <div class="verify-result" id="verify-result"></div>
      </div>

      <!-- PENDING -->
      <div class="table-card">
        <div class="table-header">
          <h3>
            En attente de paiement
            <span class="badge badge-pending" id="pending-count">0</span>
          </h3>
          <button class="refresh-btn" onclick="loadData()">↺ Rafraîchir</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Commune</th>
              <th>Date</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="pending-tbody"></tbody>
        </table>
      </div>

      <!-- PAID -->
      <div class="table-card">
        <div class="table-header">
          <h3>Payés <span class="badge badge-paid" id="paid-count">0</span></h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Commune</th>
              <th>Payé le</th>
              <th>Email</th>
              <th>Lien</th>
            </tr>
          </thead>
          <tbody id="paid-tbody"></tbody>
        </table>
      </div>
    </div>

    <script>
      let adminPwd = "";

      function login() {
        const pwd = document.getElementById("pwd-input").value;
        if (!pwd) return;
        adminPwd = pwd;
        loadData();
      }

      function logout() {
        adminPwd = "";
        document.getElementById("login-screen").style.display = "flex";
        document.getElementById("admin-screen").style.display = "none";
      }

      async function loadData() {
        const res = await fetch("/.netlify/functions/admin-stats", {
          headers: { "x-admin-password": adminPwd },
        });

        if (res.status === 401) {
          document.getElementById("login-error").style.display = "block";
          return;
        }

        document.getElementById("login-error").style.display = "none";
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("admin-screen").style.display = "block";

        const { stats, pending, paid } = await res.json();

        // Stats
        document.getElementById("s-visits").innerText =
          stats.visits.toLocaleString("fr");
        document.getElementById("s-gen").innerText =
          stats.generations.toLocaleString("fr");
        document.getElementById("s-init").innerText =
          stats.payment_inits.toLocaleString("fr");
        document.getElementById("s-paid").innerText =
          stats.paid_total.toLocaleString("fr");
        document.getElementById("s-rev").innerText =
          stats.revenue.toLocaleString("fr");

        // Pending
        document.getElementById("pending-count").innerText = pending.length;
        const pb = document.getElementById("pending-tbody");
        pb.innerHTML =
          pending.length === 0
            ? '<tr><td colspan="4" class="empty">Aucun paiement en attente</td></tr>'
            : pending
                .map(
                  (e) => `
        <tr>
          <td class="code-cell" onclick="fillCode('${e.code}')" style="cursor:pointer" title="Cliquer pour valider">
            ${e.code}
          </td>
          <td>${e.commune}</td>
          <td>${new Date(e.created_at).toLocaleString("fr-FR")}</td>
          <td>${e.user_email || "—"}</td>
        </tr>`,
                )
                .join("");

        // Paid
        document.getElementById("paid-count").innerText = paid.length;
        const padb = document.getElementById("paid-tbody");
        padb.innerHTML =
          paid.length === 0
            ? '<tr><td colspan="5" class="empty">Aucun export payé</td></tr>'
            : paid
                .map(
                  (e) => `
        <tr>
          <td class="code-cell">${e.code}</td>
          <td>${e.commune}</td>
          <td>${e.paid_at ? new Date(e.paid_at).toLocaleString("fr-FR") : "—"}</td>
          <td>${e.user_email || "—"}</td>
          <td>
            <a href="${window.location.origin.replace("/admin.html", "")}/map.html?token=${e.token}"
               target="_blank" class="result-link" style="font-size:0.65rem;padding:5px 12px">
              Ouvrir
            </a>
          </td>
        </tr>`,
                )
                .join("");
      }

      function fillCode(code) {
        document.getElementById("code-input").value = code;
        document.getElementById("code-input").focus();
        document
          .querySelector(".verify-card")
          .scrollIntoView({ behavior: "smooth" });
      }

      function formatCode(input) {
        let v = input.value.toUpperCase().replace(/[^A-Z0-9-]/g, "");
        input.value = v;
      }

      async function verifyCode() {
        const code = document
          .getElementById("code-input")
          .value.trim()
          .toUpperCase();
        const result = document.getElementById("verify-result");

        if (!code) return;

        result.style.display = "block";
        result.className = "verify-result";
        result.innerHTML = "⏳ Vérification...";

        const res = await fetch("/.netlify/functions/admin-verify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-password": adminPwd,
          },
          body: JSON.stringify({ code }),
        });

        const data = await res.json();

        if (res.status === 404) {
          result.className = "verify-result error";
          result.innerHTML = "❌ Code introuvable. Vérifie la saisie.";
          return;
        }

        if (data.already_paid) {
          result.className = "verify-result warning";
          result.innerHTML = `
      <div class="result-commune">⚠️ Déjà validé — ${data.commune}</div>
      <a href="${data.download_url}" target="_blank" class="result-link">Ouvrir la carte</a>
      <button class="copy-link" onclick="copyLink('${data.download_url}')">Copier le lien</button>
    `;
          return;
        }

        if (data.success) {
          result.className = "verify-result success";
          result.innerHTML = `
      <div class="result-commune">✅ Paiement validé — Commune de ${data.commune}</div>
      ${data.email ? `<div style="font-size:0.8rem;margin-top:4px">📧 ${data.email}</div>` : ""}
      <div style="margin-top:0.8rem">
        <a href="${data.download_url}" target="_blank" class="result-link">Ouvrir la carte</a>
        <button class="copy-link" onclick="copyLink('${data.download_url}')">Copier le lien</button>
      </div>
      ${
        data.email
          ? `
        <a href="mailto:${data.email}?subject=Votre carte Sutura Maps — ${data.commune}&body=Bonjour,%0A%0AVotre carte de la commune de ${data.commune} est prête.%0A%0ATéléchargez-la ici (lien valable 48h) :%0A${encodeURIComponent(data.download_url)}%0A%0AMerci de votre confiance.%0ASutura Maps"
           style="display:inline-block;margin-top:0.5rem;background:#25D366;color:white;
                  padding:8px 20px;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;
                  text-decoration:none;border-radius:1px">
          Envoyer par email →
        </a>`
          : ""
      }
    `;
          loadData(); // Refresh les tables
          return;
        }

        result.className = "verify-result error";
        result.innerHTML = "❌ " + (data.error || "Erreur inconnue");
      }

      function copyLink(url) {
        navigator.clipboard.writeText(url);
        event.target.innerText = "✓ Copié !";
        setTimeout(() => {
          event.target.innerText = "Copier le lien";
        }, 2000);
      }

      // Auto-load si déjà connecté (session)
      window.onload = () => {
        document
          .getElementById("pwd-input")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") login();
          });
      };
    </script>
  </body>
</html>
